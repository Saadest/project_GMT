name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ROS_DISTRO: jazzy
  DEBIAN_FRONTEND: noninteractive

jobs:
  build-and-test:
    name: Build & test (ROS 2 Jazzy)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up ROS 2
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ env.ROS_DISTRO }}
          use-ros2-testing: false

      - name: Install dependencies with rosdep
        run: |
          sudo rosdep init 2>/dev/null || true
          rosdep update --rosdistro "$ROS_DISTRO"
          # -r keeps going on keys without a rosdep definition yet
          # (e.g. warehouse_ros_mongo), so unresolved keys never mask real errors.
          rosdep install --from-paths . --ignore-src -r -y --rosdistro "$ROS_DISTRO"

      - name: Build workspace
        shell: bash
        run: |
          source "/opt/ros/$ROS_DISTRO/setup.bash"
          colcon build --symlink-install --event-handlers console_cohesion+

      - name: Run tests
        shell: bash
        run: |
          # Both the ROS installation AND this workspace's install tree must be
          # sourced, otherwise the ament lint entry points and rclpy are not
          # importable from the tests.
          source "/opt/ros/$ROS_DISTRO/setup.bash"
          source install/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose

      - name: Upload colcon logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colcon-logs
          path: log
          if-no-files-found: ignore
          retention-days: 7

  lint:
    # Advisory until the generated sources are formatted cleanly.
    # Remove `continue-on-error` once `pre-commit run --all-files` is green.
    name: Lint (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
